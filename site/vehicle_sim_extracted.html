<script>

/* 1. four stroke */

text:'පිස්ටනය පහර හතරක් යන විට (ක්‍රැන්ක් අක්ෂය වට 2ක්) එක බල චක්‍රයක් සම්පූර්ණ වේ: චූෂණය, සම්පීඩනය, බලය, පිටාරය. සෑම පහරකම කපාට මොන ආකාරයට පිහිටයිද යන්න බලන්න. ස්පාර්ක් ප්ලග් එක බල පහරේ ආරම්භයේදී ස්පාර්කය ජනනය කරයි; ක්‍රැන්ක් අක්ෂය හා සම්බන්ධක දණ්ඩේ පහළ කෙළවර ක්‍රැන්ක්කේසය තුළ කරකැවේ.',

text:'ට්‍රිගර් රෝදයේ දත් සංවේදකය අසලින් යන විට ECU එකට ස්පන්දන ලැබේ; හිස් තැන (ගැප්) TDC ට පෙර 60° යොමුව වේ. ECU එක ගැපයෙන් පසු දත් ගණන් කර, නියමිත මොහොතේ ජ්වලන දඟරය විසන්ධි කර ස්පාර්ක් ලබා දෙයි. පිස්ටනය තුළ ප්ලග් එක පත්තු වී දහනය ආරම්භ වන හැටි, ඒ අනුව සිලින්ඩර පීඩනය වෙනස් වන හැටි බලන්න. ස්ලයිඩරයෙන් ටයිමින් වෙනස් කරන්න.',

text:'වාහනවල බූස්ටරය දෙකට බෙදූ කවචයකි. මැද ඇති ඩයෆ්‍රෑම් තහඩුව වාල්ව් දේහයට (hub) සවි වී ඇත. ඉදිරිපස කුටීරය (මාස්ටර් සිලින්ඩරය පැත්ත) චෙක් කපාටය හරහා ඉන්ටේක් මැනිෆෝල්ඩයේ රික්තයට නිතරම සම්බන්ධයි. පෙඩල් දණ්ඩ වාල්ව් දේහය තුළ ඇති ප්ලන්ජරයට (වායු කපාට අසුන) සම්බන්ධයි. විවේක අවස්ථාවේ වායු කපාටය වසා රික්ත කපාටය විවෘතය, ඒ නිසා පසුපස කුටීරයද රික්තයේ ඇත. පෙඩලය එබූ විට ප්ලන්ජරය ඉදිරියට ගොස් පළමුව රික්ත කපාටය වසයි, ඉන්පසු වායු කපාටය විවෘත කර වායුගෝලීය වාතය (පෙරහන හා බූට් එක හරහා) පසුපස කුටීරයට යවයි. පීඩන වෙනසින් තහඩුව හා වාල්ව් දේහය ඉදිරියට ගොස් ප්‍රතික්‍රියා තැටිය (රබර්) හරහා ප්‍රතිදාන දණ්ඩ මාස්ටර් සිලින්ඩරයට තල්ලු කරයි. ප්‍රතික්‍රියා තැටිය බලයෙන් කොටසක් ප්ලන්ජරයට ආපසු දී පෙඩලයට “දැනීම” ලබා දෙන අතර කපාට දෙකම වසා සහාය රඳවයි (lap). පෙඩලය අත්හැරි විට රික්ත කපාටය නැවත විවෘත වී ස්ප්‍රින්ගය තහඩුව ආපසු ගෙන එයි.',

text:'ජල පොම්පය කේන්ද්‍රාපසාරී (centrifugal) වර්ගයේ පොම්පයකි; එන්ජිමේ ඉදිරිපස පහළින් සවි වී ඇත. ක්‍රැන්ක් පුලියෙන් V-බෙල්ට් එක හරහා එහි පුලිය කරකැවේ; පුලියේ සිට අක්ෂය (shaft) බෙයාරිම මත රඳවා ඇති අතර අක්ෂයේ අනෙක් කෙළවරේ ඉම්පෙලරය සවි වී ඇත. විකිරකයේ පහළ හෝස් එකෙන් (කපාටය වසා ඇති විට බයිපාස් හෝස් එකෙන්) ආ ශීතකාරකය ඉම්පෙලරයේ මැද ඇස (eye) හරහා ඇතුල් වේ. ඉම්පෙලරය කරකැවෙන විට පිටුපසට වක්‍ර වූ පියාපත් ජලය කේන්ද්‍රාපසාරී බලයෙන් පිටතට විසි කරයි; මැද පීඩනය අඩු වී තවත් ජලය උරා ගැනේ. පිටතට විසි වන ජලය සර්පිලාකාර වොලියුට් කවචය දිගේ යන විට වේගය පීඩනයක් බවට පත් වී පිටවන මාර්ගයෙන් එන්ජින් බ්ලොක් එකේ ජල ජැකට් එකට යයි. ප්‍රවාහය එන්ජින් වේගයට සමානුපාතිකයි; පීඩනය වේගයේ වර්ගයට සමානුපාතිකයි. අක්ෂය මත ඇති යාන්ත්‍රික සීල් එක (කාබන් මුහුණත + ස්ප්‍රින්ගය) ජලය බෙයාරිමට යාම වළක්වයි; එය ගෙවුණු විට ජලය වීප් සිදුරෙන් බිංදු වී කාන්දු වේ.',

dl:[['රැක් හා පිනියන්','කුඩා පිනියන් ගියරය රැක් දණ්ඩේ දත් සමඟ ගැටී රැක් එක දකුණ-වම ගමන් කරයි. සරලයි, සැහැල්ලුයි, නිරවද්‍ය ස්පර්ශයක් ඇත; බොහෝ කාර් වල භාවිතා වේ.'],['පුනරාවර්ත බෝල','පණුව අක්ෂයේ ඇති නට් එක තුළ වානේ බෝල ගලා ආපසු නළයෙන් නැවත සංසරණය වේ (ඝර්ෂණය අඩුයි). නට් එක සෙක්ටර් ගියරය හරවා පිට්මන් බාහුව චලනය කරයි. ලොරි, ජීප්, බස් වල භාවිතා වේ.'],['පිට්මන් බාහුව, ඩ්‍රැග් ලින්ක්, අයිඩ්ලර් බාහුව','බෝල ක්‍රමයේ දී සෙක්ටර් අක්ෂයේ චලිතය මධ්‍ය සම්බන්ධකය හරහා ටයි රොඩ් වලට සම්ප්‍රේෂණය කරයි; අයිඩ්ලර් බාහුව අනෙක් පැත්ත ආධාර කරයි.'],['සුක්කාන් අනුපාතය','සුක්කාන් රෝදය හැරවීම ÷ රෝද හැරවීම (උදා 16:1). අනුපාතය වැඩි නම් සැහැල්ලුයි නමුත් රෝදය වැඩියෙන් කරකැවිය යුතුයි.'],['බල සහාය (Power steering)','හයිඩ්‍රොලික් පොම්පයක් හෝ විදුලි මෝටරයක් (EPS) මගින් රියදුරුගේ උත්සාහය අඩු කරයි.'],['ආරක්ෂිත සුක්කාන් නාලය','ගැටුමකදී නැමී හෝ හකුළා රියදුරුට තුවාල වීම අඩු කරයි; විශ්ව සන්ධි (U-joints) මගින් කෝණයක් ඇති නාලය සම්බන්ධ කරයි.']],

/* ===== Nav Click & Scroll Spy ===== */
(() => {
  const nav = document.getElementById("nav");
  if (!nav) return;

  nav.addEventListener("click", e => {
    const a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    e.stopPropagation();

    const href = a.getAttribute("href");
    if (!href || !href.startsWith("#")) return;
    const id = href.slice(1);

    if (typeof window.closeVehicleModal === "function" && document.getElementById("md") && !document.getElementById("md").hidden) {
      window.closeVehicleModal();
    }

    const target = document.getElementById(id);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      nav.querySelectorAll("a").forEach(el => el.classList.remove("active"));
      a.classList.add("active");
      a.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }
  });

  if ("IntersectionObserver" in window) {
    const secObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          const link = nav.querySelector(`a[href="#${id}"]`);
          if (link) {
            nav.querySelectorAll("a").forEach(el => el.classList.remove("active"));
            link.classList.add("active");
          }
        }
      });
    }, { rootMargin: "-70px 0px -70% 0px" });

    document.querySelectorAll("main > section").forEach(s => secObserver.observe(s));
  }

  window.navigateToSim = function(id) {
    if (!id) return;
    const sec = document.getElementById(id);
    if (!sec) return;
    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
    sec.classList.remove('search-highlight-pulse');
    void sec.offsetWidth;
    sec.classList.add('search-highlight-pulse');
    const sim = sims.find(s => s.id === id);
    if (sim) {
      sim.paused = false;
      sim.vis = true;
      const pb = sec.querySelector('.sim-btn-pause');
      if (pb) pb.textContent = 'නවතන්න';
    }
  };
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'NAVIGATE_SIM' && e.data.simId) {
      window.navigateToSim(e.data.simId);
    }
  });
})();
